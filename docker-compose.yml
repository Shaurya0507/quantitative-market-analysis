services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: marketuser
      POSTGRES_PASSWORD: marketpass
      POSTGRES_DB: marketdb
    ports:
      - "5433:5432"
    volumes:
      - market_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketuser -d marketdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.app.migrate"]
    environment:
      DATABASE_URL: postgresql+psycopg://marketuser:marketpass@postgres:5432/marketdb
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://marketuser:marketpass@postgres:5432/marketdb
      MARKET_API_KEY: ${MARKET_API_KEY:-}
      MARKET_REFRESH_CHECK_INTERVAL_SECONDS: ${MARKET_REFRESH_CHECK_INTERVAL_SECONDS:-21600}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://marketuser:marketpass@postgres:5432/marketdb
      MARKET_API_KEY: ${MARKET_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  market_data:
